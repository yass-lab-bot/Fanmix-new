<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="description" content="FanMix, le monde des fangirls">
  <title>FanMix</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="banner">
    <div class="container">
      <h1 class="page-title">FanMix</h1>
      <h2>Toutes les passions sont les bienvenues!</h2>
      <p>Lance-toi dans l'aventure fanfiction!</p>
      <div class="banner-actions">
        <a href="#apply-section " class="btn-green">Rejoindre FanMix</a >
        <button class="shout-button btn-light">Un petit bonjour ?</button>
      </div>

    </div>
 </div >
   <div class="container">
     <h2>Univers des fans</h2>
  </div>
  <div class="container">
    <div class="cards">
      <div class="card">
        <img src="images/yirenzhixia.jpg" alt="Dévore des fics et écris la suite de tes histoires préférés">
        <h3>Fanfictions</h3>
      </div>

      <div class="card">
        <img src="images/sweet home.jpg" alt="Montre tes plus beaux des dessins et admire ceux des autres">
        <h3>Fanarts</h3>
      </div>

      <div class="card">
        <img src="images/leaon.jpg" alt="Rejoins tq commu;trouve ton Ship pqrfait et débat avec d'autres fans">
        <h3>Ships&Fandoms </h3>
      </div>

      <div class="card">
        <img src="images/aili.jpg" alt="Incarne tes personnages prefere.">
        <h3>Edits & Cosplay </h3>
      </div>

      </div>
    </div>
    <div id="apply-section">
      <div data-tf-live="01M4C9FB0BH3MBT3618BPA6HVQ">
      </div><script src="https://embed.typeform.com/next/embed.js"></script>
    </div>
  </div>
  <div class="container">
  <div class="contact">
    <h2>Contact</h2>
    <p>Une question ou une idée pour FanMix ? Écris-moi !</p >
    <div class="contact-actions">
      <span class="email">yassmine@renmin.com</span>
      <button class="copy-email btn-green">Copier mon e-mail</button>
    </div>
  </div>
</div>
  <script src="behavior.js"></script>
</body>
</html>
